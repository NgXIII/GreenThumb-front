stages:
  - build
  - docker_build
  - push
  - deploy

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  FRONT_IMAGE: "$CI_REGISTRY_IMAGE/front:$IMAGE_TAG"
  BACK_IMAGE:  "$CI_REGISTRY_IMAGE/back:$IMAGE_TAG"

# --- Build front (produit statique)
build_front:
  stage: build
  image: node:20
  script:
    - cd front
    - npm ci
    - npm run build
  artifacts:
    paths:
      - front/dist
  only:
    - main

# --- Build back (tests + pack)
build_back:
  stage: build
  image: node:20
  script:
    - cd back
    - npm ci
    - npm test   # échoue si tests KO
    - npm run build || true
  artifacts:
    paths:
      - back/dist
  only:
    - main

# --- Build docker images (requires runner support docker:dind)
docker_build:
  stage: docker_build
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      command: ["--storage-driver=overlay2"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t $FRONT_IMAGE ./front -f ./front/Dockerfile
    - docker build -t $BACK_IMAGE  ./back  -f ./back/Dockerfile
  only:
    - main
  artifacts:
    expire_in: 1h
    paths:
      - .

# --- Push images to GitLab Container Registry
push_images:
  stage: push
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      command: ["--storage-driver=overlay2"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker push $FRONT_IMAGE
    - docker push $BACK_IMAGE
  only:
    - main

# --- Deploy via SSH (copie docker-compose et up)
deploy_ssh:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$TEST_SERVER_HOST" >> ~/.ssh/known_hosts || true
  script:
    - scp docker-compose.yml $TEST_SERVER_USER@$TEST_SERVER_HOST:/tmp/docker-compose.yml
    - ssh $TEST_SERVER_USER@$TEST_SERVER_HOST "docker pull $FRONT_IMAGE && docker pull $BACK_IMAGE && docker-compose -f /tmp/docker-compose.yml up -d --remove-orphans"
  only:
    - main
  when: manual
  environment:
    name: test

# --- Deploy via Portainer API
deploy_portainer:
  stage: deploy
  image: curlimages/curl:8.4.0
  script:
    - |
      # encode compose file content into JSON safe string
      COMPOSE=$(awk '{gsub(/"/,"\\\""); printf "%s\\n",$0}' docker-compose.yml)
      curl -sS -X POST "$PORTAINER_URL/api/stacks?method=string&endpointId=${ENDPOINT_ID:-1}&name=gitlab-test-stack" \
        -H "Authorization: Bearer $PORTAINER_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"Name\":\"gitlab-test-stack\",\"StackFileContent\":\"$COMPOSE\",\"Env\":[]}" \
      || echo "Portainer API returned non-zero. Vérifie le token, endpointId, et l'accessibilité réseau."
  only:
    - main
  when: manual
  environment:
    name: test
