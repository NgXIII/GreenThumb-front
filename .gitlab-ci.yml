stages:
  - test
  - build

test-frontend:
  stage: test
  tags:
    - ue25
  image: node:22
  
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

  script:
    - npm ci
    - npm run test -- run

build-frontend:
  stage: build
  tags:
    - ue25
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --build-arg VITE_API_URL=$VITE_API_URL -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push --all-tags $CI_REGISTRY_IMAGE
  only:
    - main